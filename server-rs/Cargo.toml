[package]
name = "excalidash-server"
version = "0.6.5"
edition = "2021"
rust-version = "1.93"
resolver = "3"
publish = false

[lib]
name = "excalidash_server"
path = "src/lib.rs"

[[bin]]
name = "excalidash-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "set-header"] }
socketioxide = "0.17"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
