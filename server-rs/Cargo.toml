[package]
name = "excalidash-server"
version = "0.6.5"
edition = "2021"
rust-version = "1.93"
resolver = "3"
publish = false

[lib]
name = "excalidash_server"
path = "src/lib.rs"

[[bin]]
name = "excalidash-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "set-header"] }
socketioxide = "0.17"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = { version = "9", default-features = false }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
ammonia = "4"
regex = "1"
brotli = "8"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
wiremock = "0.6"
